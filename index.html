<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>NEXAR ESPORTS</title>
<style>
:root{--bg:#09090B;--bg2:#15151A;--card:#17171c;--acc:#B51222;--tx:#fff;--mut:#9A9AA7;--ok:#2FB863;--warn:#E3B93C;--err:#E5484D;--vip:#D4A93A;--ln:#ffffff12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}
body{background:radial-gradient(80% 32% at 90% -4%,#b512222e,transparent 70%),#09090B;color:var(--tx);font:500 15px/1.45 "Manrope","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit}
header{padding:14px 18px 6px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:11px}
.lm{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#d3182b,#8c0d1a);display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 6px 18px #b5122255}
.lt b{display:block;font-weight:800;font-size:17px;letter-spacing:.16em;line-height:1.1}.lt span{font-size:12px;color:var(--mut)}
.hb{display:flex;gap:8px}.ib2{position:relative;width:40px;height:40px;border-radius:50%;background:#ffffff0a;border:1px solid var(--ln);color:#fff;display:grid;place-items:center}
.ib2 svg{width:19px;height:19px}.dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:#ff3347;border:2px solid #15151a;display:none}
svg{display:block}
main{flex:1;overflow-y:auto;padding:10px 18px 120px}
section{display:none}section.on{display:block}
nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;background:#15151add;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #ffffff16;border-radius:26px;box-shadow:0 12px 34px #000b;z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border:0;border-radius:20px;background:none;color:var(--mut);font-weight:700;font-size:11px;letter-spacing:.06em;transition:background .2s,color .2s}
nav button svg{width:22px;height:22px}
nav button.on{color:#fff;background:linear-gradient(180deg,#c9162a,#a10f1e);box-shadow:0 6px 18px #b5122255}
h2.t{font-size:26px;font-weight:800;letter-spacing:-.01em;margin:6px 0 4px}#tt,#mt{margin-bottom:14px}
.sub{color:var(--mut);margin-bottom:18px}h3{font-size:16px;font-weight:800}h2{font-size:19px;font-weight:800}
.tile{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:#fff;padding:16px;margin-bottom:12px;border-radius:22px;border:1px solid var(--ln);background:linear-gradient(135deg,#222229,#16161b);overflow:hidden}
.tile:after{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:radial-gradient(#b5122238,transparent 70%)}
.ti,.tx{position:relative;z-index:1}.ti{flex:none;width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:#b5122224;color:#ff4d5e;border:1px solid #b5122260}.ti svg{width:26px;height:26px}
.tx b{display:block;font-size:17px;font-weight:800;letter-spacing:.02em}.tx em{font-style:normal;color:var(--mut);font-size:13px}
.tile>svg{margin-left:auto;width:20px;height:20px;color:var(--mut);position:relative;z-index:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;background:#ffffff08;border:1px solid var(--ln);color:var(--mut);font-size:13px;font-weight:700}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#ffffff0d;color:var(--mut);letter-spacing:.04em}
.tag.open{color:var(--ok);background:#2fb86318}.tag.full,.tag.cancelled{color:var(--err);background:#e5484d18}.tag.live{color:var(--warn);background:#e3b93c18}
.btn{width:100%;height:50px;margin-top:12px;border:0;border-radius:15px;background:linear-gradient(180deg,#c9162a,#a10f1e);color:#fff;font-weight:800;font-size:14px;letter-spacing:.06em;box-shadow:0 8px 20px #b5122238}
.btn.ghost{background:#ffffff0a;border:1px solid #ffffff16;box-shadow:none}.btn:disabled{opacity:.4;box-shadow:none}
input{width:100%;height:50px;background:#ffffff08;border:1px solid #ffffff16;border-radius:15px;padding:0 14px;color:#fff;font:inherit;margin-top:8px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.note{background:#e3b93c12;border:1px solid #e3b93c30;padding:11px 13px;border-radius:14px;font-size:13px;color:#d8c27a;margin-bottom:12px}
.empty{text-align:center;padding:52px 20px;border-radius:22px;border:1px dashed #ffffff22;background:#ffffff04}
.empty:before{content:"";display:block;width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:#b5122220;border:1px solid #b5122255}
.empty b{display:block;font-size:19px;font-weight:800;letter-spacing:.05em}
.back{display:inline-flex;align-items:center;color:var(--mut);background:#ffffff0a;border:1px solid var(--ln);border-radius:999px;padding:6px 14px 6px 10px;font-weight:700;font-size:13px;margin-bottom:12px}.back:before{content:"‹";font-size:20px;line-height:1;margin-right:6px}
.bar{height:5px;background:#ffffff10;margin-top:10px;border-radius:5px}.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin:10px 0}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:50%;background:var(--c)}
.br{overflow-x:auto;padding:6px 0 14px}.bracket{display:flex;min-width:520px}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:10px;flex:1}
.pair{position:relative;display:flex;flex-direction:column;gap:6px;padding-right:22px}
.pair:after{content:"";position:absolute;right:0;top:25%;bottom:25%;width:22px;border:1px solid #ffffff2a;border-left:0;border-radius:0 8px 8px 0}
.slot{background:#ffffff07;border:1px solid color-mix(in srgb,var(--s) 50%,transparent);border-left:3px solid var(--s);border-radius:12px;padding:7px 9px;min-height:46px;font-size:12px;color:#fff;text-align:left}
.slot b{display:block;color:var(--s);font-weight:800;font-size:11px;letter-spacing:.05em}
.s-free{--s:var(--ok)}.s-taken{--s:var(--err)}.s-admin{--s:var(--warn)}.s-vip{--s:var(--vip);background:#d4a93a14}.slot.sel{background:#2fb86320}.mine{box-shadow:0 0 0 2px #fff}
.sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:9}.sheet.on{display:flex}
.sheet>div{background:#17171c;width:100%;max-height:88%;overflow-y:auto;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;border-top:1px solid #ffffff18}
.sheet>div:before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#ffffff2a;margin:-10px auto 14px}
.toast{position:fixed;left:18px;right:18px;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#202028;border:1px solid #ffffff18;padding:12px 15px;border-radius:16px;font-size:14px;font-weight:600;display:none;z-index:10;box-shadow:0 10px 30px #000a}
.hero{background:linear-gradient(135deg,#3b0c14,#17171c 75%)}
.av{width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,#d3182b,#8c0d1a);display:grid;place-items:center;font-weight:800;font-size:26px;box-shadow:0 0 0 3px #09090B,0 0 0 5px #b5122280}
.wal{position:relative;overflow:hidden;border-radius:24px;padding:20px;margin-bottom:12px;background:linear-gradient(135deg,#d3182b,#6e0a15);box-shadow:0 16px 36px #b5122238}
.wal:after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:#ffffff14}
.wal>*{position:relative;z-index:1}.wal .l{font-size:13px;font-weight:700;opacity:.85}.wal .bal{font-size:36px;font-weight:800;margin:4px 0 6px}
.wal .btn{background:#fff;color:#7d0c18;box-shadow:none;margin-top:10px}.wal .s{font-size:12px;opacity:.8;margin-top:10px}
.bg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bdg{background:#ffffff06;border:1px solid var(--ln);border-radius:18px;padding:14px 10px;text-align:center}
.bdg .e{font-size:32px;filter:grayscale(1);opacity:.35}.bdg.on{border-color:#d4a93a80;background:linear-gradient(#d4a93a24,#ffffff06)}.bdg.on .e{filter:none;opacity:1}
.bdg b{display:block;font-weight:800;font-size:13px;letter-spacing:.06em;margin-top:6px}.bdg span{font-size:12px;color:var(--mut)}
.nt{padding:12px 0;border-bottom:1px solid var(--ln)}.nt b{font-weight:800}
#intro{position:fixed;inset:0;z-index:99;background:#09090B;display:grid;place-items:center;animation:iout .25s ease .8s forwards}
#intro .ib{text-align:center}#intro .xl{width:84px;height:84px;border-radius:26px;font-size:44px;margin:0 auto;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 0 50px #b5122288}
#intro .big{font-size:30px;font-weight:800;letter-spacing:.3em;margin:18px 0 0 .3em;animation:fi .4s ease .25s both}
#intro .bl{height:3px;background:var(--acc);margin:10px auto;border-radius:3px;box-shadow:0 0 14px var(--acc);animation:sw .6s ease .2s both}
#intro .sub{color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.5em;margin:0;animation:fi .4s ease .5s both}
@keyframes pop{from{transform:scale(.5);opacity:0;filter:blur(8px)}}@keyframes sw{from{width:0}to{width:120px}}@keyframes fi{from{opacity:0;transform:translateY(6px)}}@keyframes iout{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:no-preference){.sheet>div{animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.5}}}
@media(prefers-reduced-motion:reduce){#intro{display:none}}

.tc{background:var(--card);border:1px solid var(--ln);border-radius:22px;margin-bottom:14px;padding:0 16px 16px;overflow:hidden}
.tb{position:relative;margin:0 -16px 14px;padding:18px 16px 16px;background:linear-gradient(135deg,#4a0f19,#1c1217 70%)}
.tb .tag{position:absolute;right:14px;top:14px;background:#000a}.tb h2,.tb h3{font-size:20px;margin-top:10px;max-width:80%}
.tci{width:44px;height:44px;border-radius:14px;background:#b5122240;border:1px solid #b5122280;display:grid;place-items:center;color:#ff5566}.tci svg{width:24px;height:24px}
.tm{display:grid;grid-template-columns:1.2fr 1.2fr .8fr;gap:10px}.tm span{display:block;font-size:11px;color:var(--mut)}.tm b{font-size:13px;font-weight:800}
.sh{margin:18px 0 10px;font-size:15px;letter-spacing:.1em}
.sg{display:grid;gap:8px}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.sl{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;padding:2px}
.sl em{font-style:normal;font-size:9px;font-weight:600;opacity:.85;max-width:100%;overflow:hidden}
.sl.fr{--c:var(--ok)}.sl.vp{--c:var(--vip)}.sl.tk{--c:var(--err)}.sl.sel{background:var(--c);color:#06140a;transform:scale(1.05)}.sl.mine{box-shadow:0 0 0 2px #fff}.sl:disabled{opacity:1}
.bk{display:flex;gap:26px;min-width:max-content}.rc{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:150px}
.rt{font-weight:800;font-size:12px;color:var(--mut);letter-spacing:.08em}
.mt{position:relative;display:flex;flex-direction:column;gap:2px;background:#ffffff08;border:1px solid var(--ln);border-radius:14px;padding:4px}
.mt:after{content:"";position:absolute;left:100%;top:50%;width:26px;border-top:1px solid #ffffff2a}.rc:last-child .mt:after{display:none}
.pl{background:none;border:0;color:#fff;text-align:left;padding:9px 10px;border-radius:10px;font-weight:700;font-size:13px}.pl:disabled{opacity:1}
.pl.w{background:#2fb86326;color:#7ee2a4}.pl.l{opacity:.4}.pl.e{color:var(--mut);font-weight:500}.pl.sw{outline:2px solid var(--warn)}
.champ{margin-top:14px;padding:16px;border-radius:18px;text-align:center;background:linear-gradient(135deg,#d4a93a30,#17171c);border:1px solid #d4a93a80;font-weight:800;letter-spacing:.1em;color:var(--vip)}.champ b{display:block;font-size:22px;color:#fff;margin-top:4px;letter-spacing:0}
.up{display:block;margin-top:8px;padding:14px;border:1.5px dashed #ffffff30;border-radius:15px;text-align:center;font-weight:700;color:#fff}
.pv{display:none;width:100%;max-height:200px;object-fit:contain;border-radius:14px;margin-top:10px}
.jr{border:1px solid var(--ln);border-radius:18px;overflow:hidden;background:var(--card)}
.jh,.jrw{display:grid;grid-template-columns:34px 1fr 54px 54px;gap:6px;align-items:center;padding:12px 14px;width:100%;text-align:left;background:none;border:0;color:#fff;font-size:14px}
.jh{background:#ffffff08;color:var(--mut);font-size:12px;font-weight:800;letter-spacing:.06em}.jrw{border-top:1px solid var(--ln);font-weight:700}.jrw:disabled{opacity:1}
.jh span:nth-child(n+3),.jrw span:nth-child(n+3){text-align:center}.top0{background:linear-gradient(90deg,#d4a93a30,transparent)}.top1{background:linear-gradient(90deg,#9a9aa728,transparent)}.top2{background:linear-gradient(90deg,#b8733a26,transparent)}
.ctr{text-align:center;margin-top:14px}.fine{font-size:11px;color:var(--mut);line-height:1.35;margin:12px 0 2px;text-align:center}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}.two .btn{margin-top:8px}.tm{grid-template-columns:1fr 1fr 1.3fr!important}
#profil .card{padding:12px 14px;margin-bottom:10px;border-radius:16px}#profil h3{font-size:14px}#profil h2{font-size:17px}
#profil .btn{height:40px;margin-top:8px;font-size:12px;border-radius:12px}#profil input{height:42px;margin-top:6px;border-radius:12px;font-size:14px}
#profil .av{width:50px;height:50px;font-size:21px}#profil .hero{gap:12px!important}
#profil .wal{padding:14px 16px;border-radius:18px;margin-bottom:10px}#profil .wal .bal{font-size:28px;margin:2px 0 4px}#profil .wal .btn{margin-top:6px}#profil .wal .s{margin-top:6px;font-size:11px}
#profil .bg{gap:8px;margin-top:8px}#profil .bdg{padding:10px 8px;border-radius:14px}#profil .bdg .e{font-size:24px}#profil .bdg b{font-size:12px;margin-top:4px}#profil .bdg span{font-size:11px}
#profil .nt{padding:8px 0}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two2 .btn{margin-top:8px;height:44px;font-size:11px;padding:0 6px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:11px 12px;margin-top:8px;border-radius:12px;background:#ffffff08;border:1px solid var(--ln);color:#fff;font-weight:700;font-size:13px;text-align:left}
.arow i{font-style:normal;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;flex:none}.arow i.ok{color:var(--ok);background:#2fb86318}.arow i.sv{color:var(--warn);background:#e3b93c18}
.gr{display:flex;align-items:center;gap:12px;margin-bottom:12px}.gt{flex:1;line-height:1.25}.gt b{display:block;font-size:19px;font-weight:800;color:#ff7a88}
.pb{border-radius:20px;padding:16px;margin-bottom:12px;background:linear-gradient(120deg,#7d0c18,#d3182b 60%,#ff5a6a);box-shadow:0 12px 28px #b5122238}.pb b{display:block;font-size:17px;margin:2px 0}.pk{font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.85}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.qa button{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 2px 9px;color:#fff;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}.qa svg{width:22px;height:22px;color:#ff4d5e}
.stl{padding:0!important;overflow:hidden}.st{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:none;border:0;border-bottom:1px solid var(--ln);color:#fff;text-align:left}.st:last-child{border-bottom:0}
.si{flex:none;width:40px;height:40px;border-radius:12px;background:#ffffff0a;display:grid;place-items:center;color:#ff4d5e}.si svg{width:20px;height:20px}.sx{flex:1}.sx b{display:block;font-size:14px;font-weight:800}.sx em{font-style:normal;font-size:12px;color:var(--mut)}.st>svg{width:18px;height:18px;color:var(--mut)}
.sw{width:46px;height:27px;border-radius:999px;border:0;background:#ffffff22;position:relative}.sw:after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--acc)}.sw.on:after{left:22px}
#mtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}#mtiles .tile{flex-direction:column;text-align:center;padding:22px 10px;margin:0}#mtiles .tile>svg{display:none}#mtiles .tile:last-child{grid-column:1/-1}#mtiles .ti{width:60px;height:60px}
.seg{display:flex;background:#ffffff10;border-radius:999px;padding:3px}.seg button{border:0;background:none;color:var(--mut);font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px}.seg button.on{background:var(--acc);color:#fff}
html[data-theme=light]{--bg:#F4F4F7;--bg2:#E9E9EE;--card:#FFFFFF;--tx:#111;--mut:#6B6B76;--ln:#0000001a;color-scheme:light}
html[data-theme=light] body{background:radial-gradient(80% 32% at 90% -4%,#b5122220,transparent 70%),#F4F4F7;color:#111}
html[data-theme=light] :is(.tile,.sl,.pl,.jrw,.jh,.ib2,.qa button,.st,.arow,.up,input,.btn.ghost,.sx b,.champ b){color:#111}
html[data-theme=light] :is(.chip,.ib2,.btn.ghost,input,.bdg,.si,.arow,.back,.empty,.seg,.mt,.slot,.up,.qa button){background:#0000000a;border-color:#0000001a}
html[data-theme=light] .qa button,html[data-theme=light] .card,html[data-theme=light] .tc{background:#fff;box-shadow:0 2px 10px #0000000d}
html[data-theme=light] .tile{background:linear-gradient(135deg,#fff,#f0f0f4);border-color:#0000001a}
html[data-theme=light] .chip.on,html[data-theme=light] .seg button.on{background:var(--acc);color:#fff}
html[data-theme=light] nav{background:#ffffffee;border-color:#0000001a;box-shadow:0 10px 30px #00000026}html[data-theme=light] nav button.on{color:#fff}
html[data-theme=light] .sheet>div{background:#fff;border-top-color:#0000001a}html[data-theme=light] .sheet>div:before{background:#0000002a}
html[data-theme=light] .toast{background:#fff;color:#111;border-color:#0000001a}
html[data-theme=light] .tb{color:#fff}html[data-theme=light] .tb .mut{color:#ffd0d5}html[data-theme=light] .tb .tag{color:#fff}
html[data-theme=light] .wal,html[data-theme=light] .pb{color:#fff}html[data-theme=light] .wal .btn{color:#7d0c18}
html[data-theme=light] .pl.w{color:#17803f}html[data-theme=light] .mine{box-shadow:0 0 0 2px #111}
html[data-theme=light] .av{box-shadow:0 0 0 3px #F4F4F7,0 0 0 5px #b5122280}
html[data-theme=light] .pair:after,html[data-theme=light] .mt:after{border-color:#0000002a}
html[data-theme=light] .bar{background:#00000012}html[data-theme=light] .note{color:#8a6a00}
html[data-theme=light] .sl.sel{color:#06140a}
.lock{position:fixed;inset:0;z-index:98;background:var(--bg);display:grid;place-content:center;gap:10px;text-align:center;padding:30px;color:var(--tx)}.lock b{font-size:20px;font-weight:800}.lock span{color:var(--mut)}
#err{position:fixed;left:8px;right:8px;top:8px;z-index:200;background:#7d0c18;color:#fff;padding:8px 12px;border-radius:10px;font-size:12px}
</style></head><body>
<div id="intro"><div class="ib"><div class="lm xl">N</div><div class="big">NEXAR</div><div class="bl"></div><div class="sub">ESPORTS</div></div></div>

function place(a){let P=2;while(P<a.length)P<<=1;const r=Array(P).fill(null);let i=0;for(let m=0;m<P/2&&i<a.length;m++)r[2*m]=a[i++];for(let m=0;m<P/2&&i<a.length;m++)r[2*m+1]=a[i++];return r}
function mkBr(t,rnd){let a=plist(t);if(rnd)a.sort(()=>Math.random()-.5);const o=ST.br[t.id];ST.br[t.id]={seed:place(a),win:{},champ:o&&o.champ};save();if(SYNC)pushT(t,{br:ST.br[t.id]})}

const BADGES=[['🏆','CHAMPION','Turnir g‘olibi'],['⚡','ELITE','Elite darajadagi o‘yinchi'],['🔥','MVP','Eng yaxshi o‘yinchi'],['🎯','SNIPER','Aniqligi yuqori o‘yinchi'],['🛡️','VETERAN','Ko‘p turnirlarda qatnashgan'],['💎','LEGEND','Maxsus yuqori daraja'],['👑','TOP PLAYER','Reytingdagi kuchli o‘yinchi'],['🚀','RISING STAR','Tez rivojlanayotgan o‘yinchi']];
ST.badges=ST.badges||[]; // serverdan keladi; admin beradi
const badgesUI=()=>{$('#bgs').innerHTML=BADGES.map(b=>`<div class="bdg ${(ST.badges||[]).includes(b[1])?'on':''}"><div class="e">${b[0]}</div><b>${b[1]}</b><span>${b[2]}</span></div>`).join('')};badgesUI();
// admin
const getT=id=>T.find(t=>t.id===id);
function refresh(){if($('#tdet').style.display==='block'&&cur&&T.includes(cur))det();else if(tcat&&$('#tlist').style.display==='block')list();else tHub()}
function quit(){const go=()=>{if(tg&&tg.close)tg.close();else toast('Telegram ichida ilova yopiladi.')};if(tg&&tg.showConfirm)tg.showConfirm('Ilovadan chiqasizmi?',ok=>ok&&go());else if(confirm('Ilovadan chiqasizmi?'))go()}
function pickT(fn,m){const L=T.filter(t=>!m||(m===1?isTDM(t):!isTDM(t)));sheet(`<h3>Turnirni tanlang</h3>${L.length?L.map(t=>`<button class="btn ghost" onclick="${fn}(${t.id})">${esc(t.n)}</button>`).join(''):EMPTY}<button class="btn ghost" onclick="closeS()">YOPISH</button>`)}
function admBox(t,B){const d=isTDM(t);return `<div class="card"><h3>ADMIN</h3><div class="mut">Turnirni boshqarish (shu qurilmada saqlanadi).</div><div class="two2"><button class="btn ghost" onclick="aAdd(${t.id})">O‘YINCHI QO‘SHISH</button><button class="btn ghost" onclick="aRem(${t.id})">O‘YINCHINI CHIQARISH</button><button class="btn ghost" onclick="aSt(${t.id})">HOLATNI O‘ZGARTIRISH</button>${d?`<button class="btn ghost" onclick="aVip(${t.id})">VIP NARXINI O‘ZGARTIRISH</button><button class="btn ghost" onclick="mkBr(cur,${!!B});det()">${B?'SETKANI ARALASHTIRISH':'SETKANI YARATISH'}</button>`:''}<button class="btn ghost" style="color:var(--err)" onclick="aDel(${t.id})">TURNIRNI O‘CHIRISH</button></div></div>`}
function aSt(id){sheet(`<h3>Turnir holati</h3>${STS.map(x=>`<button class="btn ghost" onclick="setSt(${id},'${x}')">${x}</button>`).join('')}<button class="btn ghost" onclick="closeS()">YOPISH</button>`)}
function setSt(id,x){getT(id).st=x;saveT();if(SYNC)pushT(getT(id),{st:x});closeS();refresh();toast('Holat: '+x)}
function aDel(id){const t=getT(id);if(!confirm('«'+t.n+'» o‘chirilsinmi?'))return;T.splice(T.indexOf(t),1);delete ST.reg[id];delete ST.br[id];delete ST.paid[id];saveT();if(SYNC)act('tdel',{tid:id});closeS();if($('#tdet').style.display==='block')back();refresh();toast('Turnir o‘chirildi.')}
function aVip(id){sheet(`<h3>VIP slot narxi</h3><input id="av" inputmode="numeric" placeholder="UZS" value="${getT(id).vipFee||0}"><button class="btn" onclick="const v=parseInt($('#av').value,10);if(!(v>=0))return toast('Narxni kiriting.');getT(${id}).vipFee=v;saveT();if(SYNC)pushT(getT(${id}),{vipFee:v});closeS();refresh();toast('VIP narxi yangilandi.')">SAQLASH</button><button class="btn ghost" onclick="closeS()">BEKOR QILISH</button>`)}
function aAdd(id){sheet(`<h3>O‘yinchi qo‘shish</h3><input id="an" placeholder="PUBG NIKNEYM"><button class="btn" onclick="addP(${id},$('#an').value.trim())">QO‘SHISH</button><button class="btn ghost" onclick="closeS()">BEKOR QILISH</button>`)}
function addP(id,n){const t=getT(id);if(n.length<2)return toast('NIKNEYM kiriting.');if(SYNC){closeS();return act('padd',{tid:id,name:n,slot:(pick&&cur===t)?pick:null},n+' qo‘shildi.')}
 if(t.players){if(t.players.includes(n))return toast('Bu o‘yinchi allaqachon bor.');t.players.push(n)}
 else{const ks=[...Array.from({length:t.cap},(_,i)=>'S'+(i+1)),...Array.from({length:t.vcap},(_,i)=>'V'+(i+1))],k=(pick&&cur===t&&!t.reg[pick]&&ST.reg[t.id]!==pick&&ks.includes(pick))?pick:ks.find(x=>!t.reg[x]&&ST.reg[t.id]!==x);if(!k)return toast('Bo‘sh slot qolmagan.');t.reg[k]=n}
 delete ST.br[id];saveT();closeS();pick=null;refresh();toast(n+' qo‘shildi.')}
function plRows(t){return t.players?t.players.map((n,i)=>({key:i,n})):Object.entries(t.reg).map(([k,n])=>({key:"'"+k+"'",n,l:lab(k)}))}
function aRem(id){const t=getT(id),R=plRows(t);sheet(`<h3>O‘yinchini chiqarish</h3>${R.length?R.map(r=>`<div class="nt row"><b>${esc(r.n)}${r.l?' · '+r.l:''}</b><button class="chip" onclick="remP(${id},${r.key})">CHIQARISH</button></div>`).join(''):EMPTY}<button class="btn ghost" onclick="closeS()">YOPISH</button>`)}
function remP(id,key){const t=getT(id);if(SYNC){closeS();return act('prem',{tid:id,key},'O‘yinchi chiqarildi.')}if(t.players)t.players.splice(key,1);else delete t.reg[key];delete ST.br[id];saveT();closeS();refresh();toast('O‘yinchi chiqarildi.')}
function aSlot(k){sheet(`<h3>${lab(k)} slot</h3><div class="mut">${esc(cur.reg[k]||'')}</div><button class="btn" onclick="remP(cur.id,'${k}')">O‘YINCHINI CHIQARISH</button><button class="btn ghost" onclick="closeS()">YOPISH</button>`)}
function aRnd(id){const t=getT(id);cur=t;mkBr(t,true);closeS();refresh();toast('Setka aralashtirildi.')}
function aJur(id){const t=getT(id);closeS();document.querySelector('nav button[data-t=turnir]').click();tOpen(CATS.findIndex(c=>c[0]===t.c));openT(id)}
function createT(){sheet(`<h3>Turnir yaratish</h3><input id="cn" placeholder="Turnir nomi"><div class="chips" id="cc" style="margin-top:10px">${CATS.map((c,i)=>`<button class="chip ${i?'':'on'}" data-v="${c[0]}">${c[0]}</button>`).join('')}</div><input id="cd" placeholder="Sana (masalan 12-oktyabr)"><input id="ct" placeholder="Vaqt (20:00)"><input id="cy" placeholder="Yutuq (masalan 500 000 UZS)"><input id="cv" inputmode="numeric" placeholder="VIP narxi, UZS (faqat TDM)"><button class="btn" onclick="mkT()">YARATISH</button><button class="btn ghost" onclick="closeS()">BEKOR QILISH</button>`);
 $('#cc').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#cc').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')})}
function mkT(){const n=$('#cn').value.trim(),d=$('#cd').value.trim(),tm=$('#ct').value.trim(),p=$('#cy').value.trim(),c=$('#cc .on').dataset.v;
 if(n.length<3||!d||!/^\d{1,2}:\d{2}$/.test(tm)||!p)return toast('Nom, sana, vaqt (20:00) va yutuqni to‘ldiring.');
 const t={id:Date.now(),n,c,d,t:tm,dl:'—',p,st:'Qabul ochiq',rules:''};
 if(c==='TDM TURNIR'){Object.assign(t,{cap:10,vcap:4,vipFee:parseInt($('#cv').value,10)||0,reg:{}})}else t.players=[];
 if(SYNC){closeS();return act('tnew',{t},'Turnir yaratildi.')}T.push(t);saveT();closeS();refresh();toast('Turnir yaratildi.')}
function mkCoupon(){sheet(`<h3>Kupon yaratish</h3><input id="ck" placeholder="Kod (NEXAR10)"><input id="cv2" inputmode="numeric" placeholder="Qiymati (UZS)"><input id="cl" inputmode="numeric" placeholder="Foydalanish limiti"><button class="btn" onclick="saveC()">SAQLASH</button><button class="btn ghost" onclick="closeS()">BEKOR QILISH</button>`)}
function saveC(){const k=$('#ck').value.trim().toUpperCase(),v=parseInt($('#cv2').value,10),l=parseInt($('#cl').value,10);if(!/^[A-Z0-9]{3,20}$/.test(k)||!(v>0)||!(l>0))return toast('Kod, qiymat va limitni to‘g‘ri kiriting.');if(SYNC){closeS();return act('cnew',{k,v,l},'Kupon yaratildi.')}(ST.cdraft=ST.cdraft||[]).push({k,v,l});save();closeS();toast('Kupon saqlandi. Hamma uchun faollashishi uchun server kerak.')}
function sendB(){const x=$('#bt').value.trim();if(x.length<3)return toast('E’lon matnini kiriting.');if(!SYNC)return toast('Server ulanmagan.');act('bcast',{text:x},'E’lon yuborildi.').then(ok=>ok&&closeS())}
function bcast(){sheet(`<h3>E’lon yuborish</h3><input id="bt" placeholder="E’lon matni"><button class="btn" onclick="sendB()">YUBORISH</button><button class="btn ghost" onclick="closeS()">BEKOR QILISH</button>`)}
if(isAdm()){const R=[['Turnir yaratish','createT()',1],['Turnir holatini o‘zgartirish','pickT(\'aSt\')',1],['Turnirni o‘chirish','pickT(\'aDel\')',1],['O‘yinchi qo‘shish','pickT(\'aAdd\')',1],['O‘yinchini chiqarish','pickT(\'aRem\')',1],['VIP narxini o‘zgartirish','pickT(\'aVip\',1)',1],['Setkani aralashtirish (TDM)','pickT(\'aRnd\',1)',1],['Jurnal va g‘olib (KATTA/WOW)','pickT(\'aJur\',2)',1],['Kupon yaratish','mkCoupon()',SYNC?1:0],['E’lon yuborish','bcast()',SYNC?1:0],['Konkurs banneri','promoForm()',1],['To‘lov so‘rovlari','deps()',SYNC?1:0],['Nishon berish','badgeForm()',SYNC?1:0]];
 $('#adm').innerHTML=`<div class="card"><h3>ADMIN PANEL</h3>${R.map((r,i)=>`<button class="arow" onclick="${r[1]}"><span>${i+1}. ${r[0]}</span><i class="${r[2]?'ok':'sv'}">${r[2]?'ISHLAYDI':'SERVER'}</i></button>`).join('')}</div>`}
// ===== SERVER (Google Apps Script) =====
let busy=false,READY=false;
async function call(a,p){const r=await fetch(CONFIG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a,d:tg.initData,p:p||{}})});return r.json()}
async function act(a,p,ok){if(busy){if(a!=='state')toast('Kuting...');return false}busy=true;try{const r=await call(a,p);if(!r.ok){toast(r.e||'Xatolik yuz berdi.','err');return false}if(r.s)applyState(r.s);if(ok){sfx('ok');toast(ok,'-')}return true}catch(e){toast('Server bilan aloqa yo‘q. Qayta urining.');return false}finally{busy=false}}
const pushT=(t,f)=>act('tupd',{tid:t.id,f});
function applyState(s){const id=cur&&cur.id,nb=(ST.notes||[]).filter(n=>!n.r).length,m=s.me;T.length=0;T.push(...s.T);ST.pubg=m.pubg||null;ST.reg=m.reg||{};ST.paid=m.paid||{};ST.bal=m.bal||0;ST.tx=m.tx||[];ST.notes=m.notes||[];ST.badges=m.badges||[];ST.promo=s.promo||null;ST.deps=s.deps||[];ST.br={};ST.jr={};ST.jc={};
 T.forEach(t=>{if(t.br)ST.br[t.id]=t.br;if(t.jr)ST.jr[t.id]=t.jr;if(t.jc)ST.jc[t.id]=t.jc});cur=id?(T.find(t=>t.id===id)||null):null;
 balUI();dot();promoUI();showPubg();badgesUI();refresh();if(READY&&ST.notes.filter(n=>!n.r).length>nb)sNote()}
addEventListener('error',e=>{let d=document.getElementById('err');if(!d){d=document.createElement('div');d.id='err';document.body.appendChild(d)}d.textContent='Xato: '+e.message});
if(LOCKED){document.body.innerHTML='<div class="lock"><b>Telegram orqali oching</b><span>Bu ilova faqat @neexarbot ichida ishlaydi.</span></div>'}
else if(SYNC){T.length=0;ST.reg={};ST.br={};ST.jr={};ST.jc={};ST.paid={};ST.tx=[];ST.bal=0;ST.notes=[];ST.badges=[];
 document.body.insertAdjacentHTML('beforeend','<div id="ld" class="lock"><b>Yuklanmoqda…</b></div>');showPubg();tHub();mHub();
 act('state').then(ok=>{READY=true;const l=$('#ld');if(ok)l&&l.remove();else if(l)l.innerHTML='<b>Server bilan aloqa yo‘q</b><button class="btn" onclick="location.reload()">QAYTA URINISH</button>'});
 setInterval(()=>{if(!document.hidden&&!$('#sh').classList.contains('on'))act('state')},15000)}
else{showPubg();balUI();promoUI();tHub();mHub()}
function deps(){const L=ST.deps||[];sheet(`<h3>To‘lov so‘rovlari</h3><div class="mut">Chek rasmi sizga bot chatida yuborilgan.</div>${L.length?L.map(d=>`<div class="card" style="margin-top:10px"><b>#${d.id} · ${esc(d.name)}</b><div class="mut">${fmt(d.amt)} · ${d.at}</div><div class="two"><button class="btn" onclick="depAct('dok',${d.id})">TASDIQLASH</button><button class="btn ghost" onclick="depAct('dno',${d.id})">RAD ETISH</button></div></div>`).join(''):EMPTY}<button class="btn ghost" onclick="closeS()">YOPISH</button>`)}
async function depAct(a,id){if(await act(a,{id},a==='dok'?'To‘lov tasdiqlandi.':'So‘rov rad etildi.'))deps()}
function badgeForm(){sheet(`<h3>Nishon berish</h3><input id="bu" inputmode="numeric" placeholder="Foydalanuvchi Telegram ID"><div class="chips" id="bc" style="margin-top:10px;flex-wrap:wrap">${BADGES.map((b,i)=>`<button class="chip ${i?'':'on'}" data-v="${b[1]}">${b[0]} ${b[1]}</button>`).join('')}</div><button class="btn" onclick="giveB()">BERISH</button><button class="btn ghost" onclick="closeS()">YOPISH</button>`);$('#bc').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#bc').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')})}
async function giveB(){const uid=parseInt($('#bu').value,10);if(!uid)return toast('Telegram ID kiriting.');if(await act('badge',{uid,b:$('#bc .on').dataset.v},'Nishon berildi.'))closeS()}

</script></body></html>
